{% extends "base.html" %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <h1>Welcome Back</h1>

        <p class="auth-description">
            Login to continue using AI Resume Analyzer.
        </p>

        <form method="POST">

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >
            </div>

            <button type="submit" class="auth-button">
                Login
            </button>

        </form>

        <p class="auth-footer">
            Don't have an account?
            <a href="{{ url_for('auth.register') }}">
                Register
            </a>
        </p>

    </div>

</div>

{% endblock %}
