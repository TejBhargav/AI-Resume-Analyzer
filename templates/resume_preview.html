<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Resume Preview
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <nav>

        <div class="logo">
            AI Resume Analyzer
        </div>

        <div class="nav-links">

            <a href="/my-resumes">
                My Resumes
            </a>

            <a href="/dashboard">
                Dashboard
            </a>

        </div>

    </nav>


    <main class="preview-container">

        <div class="preview-header">

            <h1>
                Resume Preview
            </h1>

            <p>
                {{ resume.resume_name }}
            </p>

        </div>


        <div class="resume-preview">

            <pre>{{ resume.resume_text }}</pre>

        </div>

    </main>

</body>
</html>
