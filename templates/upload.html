{% extends "base.html" %}

{% block title %}
Upload Resume - AI Resume Analyzer
{% endblock %}

{% block content %}

<main class="upload-page">

    <div class="page-header">

        <div>

            <h1>
                Upload Resume
            </h1>

            <p>
                Upload your PDF or DOCX resume.
            </p>

        </div>

    </div>


    <section class="upload-card">

        <form
            method="POST"
            enctype="multipart/form-data"
        >

            <div class="form-group">

                <label for="resume">
                    Select Resume
                </label>

                <input
                    type="file"
                    id="resume"
                    name="resume"
                    accept=".pdf,.docx"
                    required
                >

                <small>
                    Maximum file size: 5 MB
                </small>

            </div>


            <button
                type="submit"
                class="primary-button"
            >
                Upload Resume
            </button>

        </form>

    </section>

</main>

{% endblock %}
