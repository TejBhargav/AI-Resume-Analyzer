{% extends "base.html" %}

{% block content %}

<div class="job-description-container">

    <div class="job-page-header">
        <h1>Analyze Your Resume</h1>
        <p>Select a resume and enter the job description.</p>
    </div>

    <form
        method="POST"
        action="{{ url_for('analysis.job_description') }}"
        class="job-form"
    >

        <label for="resume_id">
            Select Resume
        </label>

        <select
            id="resume_id"
            name="resume_id"
            required
        >
            <option value="">
                Select a resume
            </option>

            {% for resume in resumes %}
                <option value="{{ resume.id }}">
                    {{ resume.resume_name }}
                </option>
            {% endfor %}
        </select>

        <label for="company">
            Company
        </label>

        <input
            type="text"
            id="company"
            name="company"
            placeholder="Company name"
        >

        <label for="role">
            Job Role
        </label>

        <input
            type="text"
            id="role"
            name="role"
            placeholder="Example: Python Developer"
        >

        <label for="description">
            Job Description
        </label>

        <textarea
            id="description"
            name="description"
            placeholder="Paste the complete job description here..."
            required
        ></textarea>

        <button type="submit">
            Analyze Resume
        </button>

    </form>

</div>

{% endblock %}
